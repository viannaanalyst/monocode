[workspace]
resolver = "2"
members = ["src-tauri"]
exclude = ["vendor/portable-pty"]

[workspace.package]
version = "0.1.52"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

# wry 0.55.1 panics on macOS when WKWebView.URL() is still nil (wry#1752).
[patch.crates-io]
wry = { path = "vendor/wry" }
